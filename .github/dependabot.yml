version: 2
updates:
  # Python deps (requirements.txt + requirements-dev.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    groups:
      # Майнор/патч-обновления — в один общий PR (меньше шума)
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    ignore:
      # aiofiles 25+ конфликтует с aiogram (требует aiofiles<24.2)
      - dependency-name: "aiofiles"
        update-types: ["version-update:semver-major"]
      # SQLAlchemy 2.0.50 ужесточает типы Result -> падает mypy.
      # Снять после правки аннотаций в core/database/requests/.
      - dependency-name: "SQLAlchemy"
        versions: [">=2.0.42"]

  # GitHub Actions версии (actions/checkout, setup-python и т.д.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "ci"
