name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy core/ --ignore-missing-imports
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '0000000000:AAFakeTokenForCIOnly' }}

      - name: Run tests
        run: pytest -v
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '0000000000:AAFakeTokenForCIOnly' }}
